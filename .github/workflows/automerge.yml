# Los PR de quienes colaboran en el repo (dueño, miembros, colaboradores) se mergean solos y se publican.
# Durante el build day (14-oct-2026) esto aplicaba a CUALQUIER cuenta de GitHub: cualquiera podía
# poner contenido en main y en el sitio publicado sin revisión. Desde el 2026-11-09 los PR de
# cuentas externas se quedan abiertos para revisión manual.
# Candados: no se ejecuta código del PR y se rechazan cambios a .github/.
name: Auto-merge
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  merge:
    if: contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Rechazar cambios a .github/
        shell: bash
        run: |
          set -euo pipefail
          # La lista de archivos del API incluye el nombre anterior de un rename; `gh pr diff --name-only`
          # solo da el nuevo, y sin pipefail un fallo del comando se leía como "no toca .github/".
          files="$(gh api --paginate "repos/$GH_REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)')"
          if grep -q '^\.github/' <<<"$files"; then
            gh pr comment "$PR" --body "Este PR toca \`.github/\`, así que no se mergea automáticamente. Un mantenedor lo revisará."
            exit 1
          fi
      - name: Mergear
        run: gh pr merge "$PR" --squash --delete-branch=false
      # Los merges hechos con GITHUB_TOKEN no disparan el evento push; lanzamos el deploy a mano.
      - name: Publicar
        run: gh workflow run deploy.yml --ref main
